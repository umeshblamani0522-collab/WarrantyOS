# MySQL configuration
# Change DB_USERNAME / DB_PASSWORD in your environment when required.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/warranty_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# API / application settings
spring.jackson.serialization.write-dates-as-timestamps=false
sla.hours=${SLA_HOURS:48}
server.port=${SERVER_PORT:8080}

# Authentication / real-time settings
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Registration / password recovery
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.mail-mode=${APP_MAIL_MODE:smtp}
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:WarrantyOS}
app.mail.starttls=${MAIL_STARTTLS:true}
app.mail.auth=${MAIL_AUTH:true}
